<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Hexagon background -->
  <polygon points="100,15 175,57.5 175,142.5 100,185 25,142.5 25,57.5" fill="url(#grad)" />
  <!-- Circuit brain pattern -->
  <circle cx="100" cy="100" r="30" fill="none" stroke="white" stroke-width="3"/>
  <line x1="100" y1="70" x2="100" y2="50" stroke="white" stroke-width="2.5"/>
  <line x1="130" y1="85" x2="148" y2="75" stroke="white" stroke-width="2.5"/>
  <line x1="130" y1="115" x2="148" y2="125" stroke="white" stroke-width="2.5"/>
  <line x1="100" y1="130" x2="100" y2="150" stroke="white" stroke-width="2.5"/>
  <line x1="70" y1="115" x2="52" y2="125" stroke="white" stroke-width="2.5"/>
  <line x1="70" y1="85" x2="52" y2="75" stroke="white" stroke-width="2.5"/>
  <!-- Nodes -->
  <circle cx="100" cy="48" r="5" fill="white"/>
  <circle cx="150" cy="73" r="5" fill="white"/>
  <circle cx="150" cy="127" r="5" fill="white"/>
  <circle cx="100" cy="152" r="5" fill="white"/>
  <circle cx="50" cy="127" r="5" fill="white"/>
  <circle cx="50" cy="73" r="5" fill="white"/>
  <!-- Inner dots -->
  <circle cx="100" cy="88" r="4" fill="white" opacity="0.8"/>
  <circle cx="112" cy="108" r="4" fill="white" opacity="0.8"/>
  <circle cx="88" cy="108" r="4" fill="white" opacity="0.8"/>
</svg>
