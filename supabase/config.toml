[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://www.digipromix.com"
additional_redirect_urls = ["https://www.digipromix.com", "https://digipromix.com", "http://localhost:5173", "https://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"
redirect_uri = ""

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

# schedule-crawls is triggered by pg_cron (see migration 012_pg_cron_schedule.sql)
[functions.schedule-crawls]
verify_jwt = false

# crawl-page is only invoked internally by schedule-crawls and the Render
# Playwright crawler — no public auth needed.
[functions.crawl-page]
verify_jwt = false

# detect-changes is invoked internally by crawl-page after a new snapshot.
[functions.detect-changes]
verify_jwt = false

# cleanup-orphan-snapshots is a maintenance function — runs ad-hoc or
# via pg_cron. Internal-only so verify_jwt is off.
[functions.cleanup-orphan-snapshots]
verify_jwt = false

# health-check is publicly callable by uptime monitors — no auth.
[functions.health-check]
verify_jwt = false

# score-opportunities is called by pg_cron — internal only, no user auth.
[functions.score-opportunities]
verify_jwt = false

# embed-campaign is invoked internally by generate-campaign (and backfill
# scripts) via the admin_token bypass. No user-facing auth.
[functions.embed-campaign]
verify_jwt = false

# optimize-campaigns runs daily via pg_cron — internal only.
[functions.optimize-campaigns]
verify_jwt = false

[functions.send-email-alert]
verify_jwt = false

[functions.generate-campaign]
verify_jwt = false

[functions.meta-oauth]
verify_jwt = false

[functions.launch-meta-campaign]
verify_jwt = false

[functions.google-ads-oauth]
verify_jwt = false

[functions.launch-google-ads-campaign]
verify_jwt = false

[functions.submit-lead]
verify_jwt = false

[functions.send-webhook]
verify_jwt = false

[analytics]
enabled = true
port = 54327
backend = "postgres"
